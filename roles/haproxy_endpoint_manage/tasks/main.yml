- name: Set haproxy service state
  community.general.haproxy:
    socket: "{{ haproxy_socket }}"
    backend: "{{ haproxy_backend | default(omit) }}"
    drain: "{{ haproxy_drain }}"
    host: "{{ haproxy_host }}"
    state: "{{ haproxy_state }}"
    shutdown_sessions: "{{ haproxy_shutdown_sessions | bool }}"
    wait: "{{ haproxy_wait | bool }}"
    wait_interval: "{{ haproxy_wait_interval }}"
    wait_retries: "{{ haproxy_wait_retries }}"
    weight: "{{ haproxy_weight | default(omit) }}"
  delegate_to: "{{ _haproxy_item }}"
  with_items: "{{ haproxy_target_hosts }}"
  loop_control:
    loop_var: _haproxy_item
  tags:
    - common-haproxy
